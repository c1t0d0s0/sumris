<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUMRIS</title>
    <link rel="stylesheet" href="style.css?20260109">
</head>
<body>

    <div class="game-container">
        <div class="top-bar">
            <span>SCORE: <span id="score">0</span></span>
            <div class="next-container">
                <span>NEXT:</span>
                <canvas id="next-block-canvas"></canvas>
            </div>
        </div>
    
        <div class="game-main">
            <canvas id="game-board"></canvas>
            <div id="game-over-screen" class="game-overlay" style="display: none;">
                <h2>GAME OVER</h2>
                <button id="restart-btn-over">RESTART</button>
            </div>
            <div id="game-clear-screen" class="game-overlay" style="display: none;">
                <h2>GAME CLEAR!</h2>
                <p class="final-score-text">FINAL SCORE: <span id="final-score">0</span></p>
                <button id="restart-btn-clear">RESTART</button>
            </div>
            <div id="start-screen" class="game-overlay">
                <h1>SUMRIS</h1>
                <button id="start-btn">START</button>
            </div>
        </div>
    
        <div class="bottom-bar">
            <div class="controls">
                <button id="left-btn">⇦</button>
                <button id="down-btn">⇩</button>
                <button id="right-btn">⇨</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Dynamically create the GTM script tag
        const gtmScript = document.createElement('script');
        gtmScript.async = true;
        gtmScript.src = `https://www.googletagmanager.com/gtag/js?id=${GTM_ID}`;
        document.head.appendChild(gtmScript);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', GTM_ID);
    </script>
    <script src="script.js?20260109"></script>
</body>
</html>
